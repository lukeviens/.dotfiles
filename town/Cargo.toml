[package]
name = "town"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "town"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "time", "net", "sync", "io-util", "macros"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "async", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
