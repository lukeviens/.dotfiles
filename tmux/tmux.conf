TMUX_DIR="$HOME/.config/tmux"
TOWN="$HOME/.config/town/target/release/town"   # the town CLI, one place (see the run-shell bindings)

### styles

# colours (from shared theme)
run-shell 'while IFS="=" read -r key val; do \
  case "$key" in "#"*|"") continue ;; esac; \
  tmux set -g "@color_${key}" "${val}"; \
done < ~/.config/theme/colors; \
tmux set -g "@color_active_bg" "$(tmux show -gv @color_bg)"; \
tmux set -g "@color_active_fg" "$(tmux show -gv @color_active)"'

# status bar
set -g status on
set -g status-position bottom
set -g status-style "bg=#{@color_bg},fg=#{@color_fg}"

# pane borders
set -g pane-border-style "fg=#{@color_subtle}"
set -g pane-active-border-style "fg=#{@color_accent}"

# windows 
set -g window-status-style "bg=#{@color_bg},fg=#{@color_subtle}"
set -g window-status-format " #[fg=#{@color_subtle}]#I #W "

set -g window-status-current-style "bg=#{@color_active_bg},fg=#{@color_active_fg},bold"
set -g window-status-current-format " #[fg=#{@color_active_fg},bold]#I #W* "

# system stats: a background collector samples CPU/MEM/NET/DISK and writes a
# pre-coloured line to a cache file; the bar just reads the cache (never blocks).
run-shell "$TMUX_DIR/scripts/sysstat.sh"

# status left / right
set -g status-left "#[bg=#{@color_active_bg},fg=#{@color_active_fg},bold] #S #[default]"

set -g status-right "#[fg=#{@color_subtle}]#(echo #{pane_current_path} | sed s#$HOME#~#g)  #(cat /tmp/tmux-sysstat.txt 2>/dev/null)#[default]"

set -g status-interval 2

set -g status-left-length 30
set -g status-right-length 150

# terminal integration
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string "#S"


### main config

set -as terminal-overrides ',st*:Ss@'
set-option -sa terminal-features ',XXX:RGB'

set -g mouse on
setw -g mode-keys vi

# copy code commands
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

bind s choose-tree -sZ -O name


### session jumplist
unbind-key i
unbind-key o

bind-key o run-shell "$TOWN talk past key at=tmux press=o"
bind-key i run-shell "$TOWN talk past key at=tmux press=i"
set-hook -g client-session-changed 'run-shell "$TOWN talk place kind=session name=#{session_name}"'
###


# (session finding lives in town now — Caps f / Caps s. sesh popup retired.)

# tpm
set -g @tpm_plugins ' \
	tmux-plugins/tpm \
	tmux-plugins/tmux-sensible \
	tmux-plugins/tmux-resurrect \
	christoomey/vim-tmux-navigator \
	sainnhe/tmux-fzf \
'

# order sessions by name
set -g @resurrect-processes '~Vim -> vim'

# initialize tmux plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# free ⌃hjkl entirely: undo vim-tmux-navigator's own ⌃hjkl tmux binds (set by tpm above),
# so at a bare shell ⌃h is backspace / ⌃l clears — no nav collision.
unbind -n C-h ; unbind -n C-j ; unbind -n C-k ; unbind -n C-l

# ── town motion transport ───────────────────────────────────────────────────────────────────
# hjkl glide / resize / swap / split / scroll are all GENERATED from one table (residents/
# transport.lua) into this file, so the byte HS injects and the key tmux binds are the same fact,
# never hand-synced. `defer` (in that table) is the vim/edge/select routing you used to see here.
# -q: load quietly if town hasn't written it yet (first boot).  ⌥ not ⌃, so no shell/readline clash.
source-file -q ~/.config/tmux/town-transport.conf

# ⌃⏎ zoom: WezTerm sends Ctrl+Enter as the CSI-u sequence \e[13;5u; map it to a user
# key and zoom the pane. (mac apps are maximized by HS's ⌃⏎ instead.)
set -s user-keys[0] "\e[13;5u"
bind -n User0 resize-pane -Z
