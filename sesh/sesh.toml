# sesh — your editable session list.
# `prefix + f` in tmux fuzzy-finds these named sessions + any live tmux
# sessions + your zoxide dirs. Add/edit/remove entries below to manage them.
#
# Fields per session:
#   name             label shown in the finder
#   path             directory the session opens in
#   startup_command  (optional) command run when the session is first created
#   preview_command  (optional) what shows in the fzf preview pane
#
# After editing this file there's nothing to reload — sesh reads it live.
# NOTE: this file only ADDS pinned sessions. Live tmux sessions always
# appear in the finder whether or not they're listed here.

